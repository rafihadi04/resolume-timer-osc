<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Resolume Timer Remote</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #121a23;
      --border: #243143;
      --text: #e9f0fa;
      --muted: #8da2bb;
      --accent: #3ddc97;
      --danger: #ff4d6d;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(700px 400px at 50% -10%, rgba(61, 220, 151, 0.12), transparent 60%),
        linear-gradient(160deg, #0b0f14, #080d13);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 16px;
      gap: 16px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      background: rgba(13, 20, 28, 0.85);
    }

    .connection::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.12);
    }

    .connection.online::before {
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(61, 220, 151, 0.14), 0 0 14px rgba(61, 220, 151, 0.7);
    }

    .panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(18, 26, 35, 0.97), rgba(10, 15, 21, 0.97));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    .label-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .phase, .mode, .speed-tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(9, 14, 20, 0.7);
    }

    .timer {
      font-family: Consolas, "SFMono-Regular", "Roboto Mono", monospace;
      font-size: clamp(48px, 15vw, 84px);
      font-weight: 700;
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-align: center;
      word-break: break-word;
      color: var(--accent);
      transition: color 120ms linear;
    }

    .progress {
      width: 100%;
      max-width: 520px;
      height: 10px;
      margin-top: 20px;
      border-radius: 999px;
      border: 1px solid #1b2634;
      background: #070b10;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: var(--accent);
      transition: width 200ms linear, background-color 200ms linear;
      box-shadow: 0 0 18px currentColor;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 520px;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      font-family: Consolas, "SFMono-Regular", monospace;
    }

    .stats-row strong {
      color: var(--text);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 12px;
      background: #141d27;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 90ms ease, background 140ms ease, border-color 140ms ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button.primary {
      grid-column: 1 / -1;
      border-color: transparent;
      background: linear-gradient(135deg, #3ddc97, #22c98a);
      color: #04110b;
      box-shadow: 0 10px 25px rgba(61, 220, 151, 0.22);
      font-size: 18px;
    }

    button.danger {
      border-color: rgba(255, 77, 109, 0.4);
      color: #ffb3c1;
      background: rgba(255, 77, 109, 0.08);
    }

    /* Section styling */
    .section-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(18, 26, 35, 0.92);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .speed-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .speed-btn {
      padding: 10px 4px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      background: #10161f;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .speed-btn.active {
      background: var(--accent);
      color: #04110b;
      border-color: var(--accent);
    }

    .notes-box {
      width: 100%;
      background: #090e14;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 10px;
      resize: vertical;
      min-height: 70px;
      box-sizing: border-box;
      line-height: 1.4;
    }

    .notes-box:focus {
      outline: none;
      border-color: var(--accent);
    }

    .notes-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-small {
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 10px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    @media (min-width: 650px) {
      body {
        align-items: center;
      }
      .top, .panel, .controls, .section-card, .hint {
        width: min(580px, 100%);
      }
    }
  </style>
</head>
<body>
  <div class="top">
    <span class="brand">Resolume Timer Remote</span>
    <span id="connection" class="connection">Connecting</span>
  </div>

  <div class="panel">
    <div class="label-row">
      <span id="phase" class="phase">Ready</span>
      <span id="mode" class="mode">Remote</span>
      <span id="speedTag" class="speed-tag" style="display: none;">1.0x</span>
    </div>
    <div id="timer" class="timer">00:00:00</div>
    <div class="progress"><div id="progress"></div></div>
    <div class="stats-row">
      <span>Elapsed: <strong id="elapsedText">00:00:00</strong></span>
      <span>Remaining: <strong id="remainingText">00:00:00</strong></span>
    </div>
  </div>

  <div class="controls">
    <button id="toggle" class="primary" type="button">Start</button>
    <button type="button" data-action="adjust" data-seconds="60">+1 min</button>
    <button type="button" data-action="adjust" data-seconds="-60">-1 min</button>
    <button type="button" data-action="adjust" data-seconds="10">+10 sec</button>
    <button type="button" data-action="adjust" data-seconds="-10">-10 sec</button>
    <button id="reset" class="danger" type="button">Reset</button>
  </div>

  <!-- Speed control section -->
  <div class="section-card">
    <div class="section-title">
      <span>Playback Speed</span>
      <span id="currentSpeedLabel" style="color: var(--text);">1.0x</span>
    </div>
    <div class="speed-grid">
      <button type="button" class="speed-btn" data-speed="0.5">0.5x</button>
      <button type="button" class="speed-btn active" data-speed="1">1.0x</button>
      <button type="button" class="speed-btn" data-speed="1.25">1.25x</button>
      <button type="button" class="speed-btn" data-speed="1.5">1.5x</button>
      <button type="button" class="speed-btn" data-speed="2">2.0x</button>
    </div>
  </div>

  <!-- Notes section -->
  <div class="section-card">
    <div class="section-title">
      <span>Stage / Speaker Notes</span>
      <span id="notesStatus" style="font-size: 10px; font-weight: normal;"></span>
    </div>
    <textarea id="notesInput" class="notes-box" placeholder="Type notes for the stage, speaker, or Resolume..."></textarea>
    <div class="notes-actions">
      <button id="clearNotesBtn" type="button" class="btn-small danger" style="padding: 8px 12px;">Clear</button>
      <button id="applyNotesBtn" type="button" class="btn-small" style="background: var(--accent); color: #04110b; border-color: transparent;">Apply Notes</button>
    </div>
  </div>

  <!-- Stage Attention Alerts section -->
  <div class="section-card">
    <div class="section-title">
      <span>Stage Attention Alert</span>
      <span id="remoteFlashStatus" style="font-size: 11px; font-weight: 700; color: #ff4d6d;"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">
      <button type="button" class="btn-small" data-flash-dur="3">Flash 3s</button>
      <button type="button" class="btn-small" data-flash-dur="5" style="border-color: rgba(255, 77, 109, 0.5); color: #ffb3c1;">Flash 5s</button>
      <button type="button" class="btn-small" data-flash-dur="10">Flash 10s</button>
    </div>
    <button id="stopFlashBtn" type="button" class="btn-small danger" style="display: none; width: 100%; margin-top: 4px;">Stop Screen Flash</button>
  </div>

  <p class="hint">Keep this phone on the same Wi-Fi/network as the timer computer.</p>

  <script>
    const timerEl = document.getElementById('timer');
    const phaseEl = document.getElementById('phase');
    const modeEl = document.getElementById('mode');
    const speedTagEl = document.getElementById('speedTag');
    const currentSpeedLabelEl = document.getElementById('currentSpeedLabel');
    const progressEl = document.getElementById('progress');
    const connectionEl = document.getElementById('connection');
    const toggleEl = document.getElementById('toggle');
    const notesInputEl = document.getElementById('notesInput');
    const notesStatusEl = document.getElementById('notesStatus');
    const applyNotesBtn = document.getElementById('applyNotesBtn');
    const clearNotesBtn = document.getElementById('clearNotesBtn');
    const remoteFlashStatusEl = document.getElementById('remoteFlashStatus');
    const stopFlashBtn = document.getElementById('stopFlashBtn');
    const flashDurButtons = document.querySelectorAll('[data-flash-dur]');
    const speedButtons = document.querySelectorAll('.speed-btn');

    let lastState = null;
    let isEditingNotes = false;

    function sendCommand (command) {
      fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(command)
      }).catch(() => {});
    }

    function render (state) {
      lastState = state;
      timerEl.textContent = state.text || '00:00:00';
      timerEl.style.color = state.color || '#3ddc97';
      phaseEl.textContent = state.phaseLabel || state.phase || 'Ready';
      modeEl.textContent = state.modeLabel || 'Remote';

      const currentSpeed = Number(state.speed) || 1;
      currentSpeedLabelEl.textContent = currentSpeed.toFixed(currentSpeed % 1 === 0 ? 1 : 2) + 'x';
      if (currentSpeed !== 1) {
        speedTagEl.textContent = currentSpeed.toFixed(1) + 'x';
        speedTagEl.style.display = 'inline-block';
      } else {
        speedTagEl.style.display = 'none';
      }

      speedButtons.forEach((btn) => {
        const btnSpeed = Number(btn.dataset.speed);
        btn.classList.toggle('active', Math.abs(btnSpeed - currentSpeed) < 0.01);
      });

      if (!isEditingNotes && document.activeElement !== notesInputEl) {
        notesInputEl.value = state.notes || '';
      }

      progressEl.style.width = Math.round((Number(state.progress) || 0) * 1000) / 10 + '%';
      progressEl.style.backgroundColor = state.color || '#3ddc97';

      const elapsedEl = document.getElementById('elapsedText');
      const remainingEl = document.getElementById('remainingText');
      if (elapsedEl && state.elapsedText) {
        elapsedEl.textContent = state.elapsedText;
      }
      if (remainingEl && state.remainingText) {
        remainingEl.textContent = state.remainingText;
      }

      const flashUntil = Number(state.screenFlashUntil) || 0;
      const isScreenFlashing = flashUntil > Date.now();
      if (isScreenFlashing) {
        const secLeft = Math.max(1, Math.ceil((flashUntil - Date.now()) / 1000));
        if (remoteFlashStatusEl) remoteFlashStatusEl.textContent = `FLASHING (${secLeft}s)`;
        if (stopFlashBtn) stopFlashBtn.style.display = 'block';
      } else {
        if (remoteFlashStatusEl) remoteFlashStatusEl.textContent = '';
        if (stopFlashBtn) stopFlashBtn.style.display = 'none';
      }

      toggleEl.textContent = state.status === 'running' ? 'Pause' : state.status === 'paused' ? 'Resume' : state.status === 'finished' ? 'Restart' : 'Start';
      toggleEl.dataset.status = state.status || 'idle';
      document.title = (state.text || '00:00:00') + ' - Resolume Timer';
    }

    async function poll () {
      try {
        const response = await fetch('/api/state', { cache: 'no-store' });
        if (!response.ok) throw new Error('bad status');
        render(await response.json());
        connectionEl.textContent = 'Live';
        connectionEl.classList.add('online');
      } catch (_error) {
        connectionEl.textContent = 'Offline';
        connectionEl.classList.remove('online');
      }
    }

    toggleEl.addEventListener('click', () => {
      const status = lastState ? lastState.status : 'idle';
      sendCommand({ action: status === 'running' ? 'pause' : 'start' });
    });

    document.getElementById('reset').addEventListener('click', () => {
      sendCommand({ action: 'reset' });
    });

    document.querySelectorAll('[data-action="adjust"]').forEach((button) => {
      button.addEventListener('click', () => {
        sendCommand({ action: 'adjust', seconds: Number(button.dataset.seconds) });
      });
    });

    speedButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const speed = Number(button.dataset.speed);
        if (Number.isFinite(speed) && speed > 0) {
          sendCommand({ action: 'setSpeed', speed });
        }
      });
    });

    flashDurButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const dur = Number(button.dataset.flashDur) || 5;
        sendCommand({ action: 'flashScreen', duration: dur });
      });
    });

    if (stopFlashBtn) {
      stopFlashBtn.addEventListener('click', () => {
        sendCommand({ action: 'stopScreenFlash' });
      });
    }

    notesInputEl.addEventListener('focus', () => {
      isEditingNotes = true;
      notesStatusEl.textContent = 'Editing...';
    });

    notesInputEl.addEventListener('blur', () => {
      setTimeout(() => {
        isEditingNotes = false;
        notesStatusEl.textContent = '';
      }, 5000);
    });

    applyNotesBtn.addEventListener('click', () => {
      const notes = notesInputEl.value;
      sendCommand({ action: 'setNotes', notes });
      notesStatusEl.textContent = 'Updated!';
      isEditingNotes = false;
      setTimeout(() => {
        notesStatusEl.textContent = '';
      }, 2000);
    });

    if (clearNotesBtn) {
      clearNotesBtn.addEventListener('click', () => {
        notesInputEl.value = '';
        sendCommand({ action: 'setNotes', notes: '' });
        notesStatusEl.textContent = 'Cleared!';
        isEditingNotes = false;
        setTimeout(() => {
          notesStatusEl.textContent = '';
        }, 2000);
      });
    }

    poll();
    setInterval(poll, 400);
  </script>
</body>
</html>
