name: Build Electron App

on:
  push:
    branches:
      - main
      - develop
  release:
    types: [published]

jobs:
  build-dev-windows:
    name: Build Windows Portable (Development)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    env:
      GYP_MSVS_VERSION: '2022'
      npm_config_msvs_version: '2022'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Portable Executable
        run: npm run build:win-portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_QR_STATIC: ${{ vars.QR_STATIC }}
          VITE_QRIS_STATIC: ${{ vars.QR_STATIC }}

      - name: Upload Windows Artifact (v4)
        uses: actions/upload-artifact@v4
        with:
          name: Resolume-Timer-Win-Portable-Dev
          path: dist/*.exe
          retention-days: 7

  build-release:
    name: Build Multi-Platform Release (Windows & macOS)
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    env:
      GYP_MSVS_VERSION: '2022'
      npm_config_msvs_version: '2022'

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Release Artifacts
        run: npm run build:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_QR_STATIC: ${{ vars.QR_STATIC }}
          VITE_QRIS_STATIC: ${{ vars.QR_STATIC }}

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
